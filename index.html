<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw a Wolfy Card: Deck Incremental</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Draw a Wolfy Card</h1>
        
        <div class="stats">
            <p>Dinero: $<span id="money">0</span></p>
            <p>Cartas en mesa: <span id="cards-on-table">0</span>/20</p>
            <p>Cartas descubiertas: <span id="cards-discovered">0</span></p>
        </div>
        
        <div class="buttons">
            <button id="btn-carddex" class="btn">📖 Carddex</button>
        </div>
        
        <div class="deck-area">
            <div id="deck" class="deck">
                <div class="deck-card">Baraja<br>(20)</div>
            </div>
        </div>
        
        <div class="table-area">
            <h3>Mesa</h3>
            <div id="table" class="table"></div>
        </div>
        
        <!-- Modal del Carddex -->
        <div id="carddex-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2>Carddex - Colección</h2>
                <div id="carddex-grid" class="carddex-grid"></div>
            </div>
        </div>
        
        <div id="card-animation" class="card-animation hidden"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
